description: pipeline to remove as much homo sapien dna from mags.
imports:
  - http:/schema.databio.org/pep/2.0.0.yaml
properties:
  samples:
    type: array
    items:
      type: object
      properties:
        project:
          type: string
          description: "Project Identifier For The Sample"
        sample_name: 
          type: string
          description: "Name Of The Sample"
        seq_method:
          type: string
          description: "Paired end, single end"
          enum: ["paired_end","single_end"]
        mode:
          type: string
          description: "Can be one of three modes: full, post_ncbi, no_trim"
          enum: ["full","post_ncbi","no_trim"]
        reads:
          anyOf:
            - type: string
              description: "Fastq files for a sample"
            - type: array
              items:
            - type: string
      required_files:
        - reads
      required:
        - sample_name
        - project
required:
  - samples
